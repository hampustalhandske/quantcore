[project]
name = "quantcore"
version = "0.3.1"
description = "Optimized numerical backend for derivative pricing, SDE simulation, and risk metrics"
readme = "README.md"
requires-python = ">=3.12"
# Lower bounds are the versions the test suite runs on. Upper bounds sit at the next release
# that may change an API or a default quantcore relies on: arch's next major and statsmodels'
# next minor (statsmodels is pre-1.0). numba itself caps numpy.
dependencies = [
    "numba>=0.67",
    "numpy>=2.5",
    "scipy>=1.18",
    # arch fits GARCH, EGARCH and GJR-GARCH and computes the stationary bootstrap, its block
    # length and the SPA test (imported on first use); statsmodels computes the ADF,
    # Engle-Granger, KPSS, ARCH-LM and Ljung-Box tests and the VAR functions.
    "arch>=8.0,<9",
    "statsmodels>=0.15,<0.16",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "scipy-stubs>=1.13",
]
# Independent oracle implementations that tests/oracle/ and conformance/
# verify quantcore's numbers against. Apart from `arch`, listed under
# `dependencies`, none is imported from src/quantcore. Pinned exactly: the conformance suite's derandomized
# cases and recorded error bounds are only reproducible against fixed oracle
# and hypothesis versions.
oracle = [
    "statsmodels==0.15.0",
    "arch==8.0.0",
    "scikit-learn==1.9.1",
    "linearmodels==7.0",
    "empyrical-reloaded==0.5.12",
    "quantstats==0.0.81",
    "py_vollib==1.0.12",
    "hmmlearn==0.3.3",
    "filterpy==1.4.5",
    "cvxpy==1.9.3",
    "pandas==3.0.6",
    "hypothesis==6.168.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff: linting + formatting (replaces black/isort/flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "conformance"]
# Finding write-ups quote repro scripts and their printed output verbatim in
# code fences; they are prose records, not source to reformat.
extend-exclude = ["conformance/findings_src", "conformance/findings"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common bugs)
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Kalman filter state-space notation (A, H, Q, R, P0) matches the standard
# textbook convention (Kalman 1960) and the module's own formula docstring;
# renaming to snake_case would obscure the correspondence to the math.
"src/quantcore/filtering/kalman.py" = ["N803"]
# Black-Litterman view matrix/vector notation (P, Q) matches the standard
# textbook convention (Black & Litterman 1992) and the module's own formula
# docstring; renaming to snake_case would obscure the correspondence to the math.
"src/quantcore/portfolio/black_litterman.py" = ["N803"]
# Test files exercising the same textbook matrix/vector notation as the
# modules above (A, H, Q, R, P0 for Kalman; P, Q for Black-Litterman; X, T
# for OLS) — same rationale as the source-file ignores above.
"tests/unit/filtering/test_kalman.py" = ["N806"]
"tests/unit/portfolio/test_black_litterman.py" = ["N806"]
"tests/unit/statistics/test_regression.py" = ["N806"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy: static type checking (strict, since this is a numerical library
# other projects will pip install and depend on for correctness)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]
plugins = ["numpy.typing.mypy_plugin"]


[[tool.mypy.overrides]]
# Numba's JIT decorators confuse static analysis; relax there only.
module = "quantcore.core.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# statsmodels ships no type information.
module = ["statsmodels.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# conformance/ is a plain directory at the repo root, not part of the installed
# package; this makes it importable as `conformance.*` both for
# `uv run pytest conformance` and for tests/unit/conformance/.
pythonpath = ["."]
markers = [
    "oracle: differential test against an independent reference implementation (requires the 'oracle' extra); see tests/oracle/README.md",
]

name: Conformance explore

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The explore profile draws fresh (not derandomized) inputs on every
    # run, so a schedule is what gives it new ground to cover over time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  conformance-explore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      QUANTCORE_CONFORMANCE_PROFILE: explore
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (dev + oracle)
        run: uv sync --extra dev --extra oracle

      # Writes no file in the repository. The builder prints, for every target the committed
      # conformance/conformance_map.json calls verified, any mismatch this run recorded, each
      # with the family, bucket and seed needed to replay it, and exits non-zero if there is at
      # least one. Mismatches of a defect or non-standard target are expected and ignored.
      # `pipefail` keeps a failure of either command from being hidden by `tee`.
      - name: Conformance suite (explore profile)
        id: explore
        shell: bash
        run: |
          set -o pipefail
          uv run pytest conformance -q -x 2>&1 | tee explore.log
          uv run python -m conformance.build_report 2>&1 | tee -a explore.log

      # A regression found by the explore profile opens an issue instead of failing quietly in
      # Actions. An already-open issue carrying the `conformance-explore-regression` label gets
      # a comment, so one ongoing regression does not file a new issue every week. Uses the
      # default `GITHUB_TOKEN`, scoped to `issues: write` above.
      - name: Open or update a regression issue
        if: failure() && steps.explore.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const label = 'conformance-explore-regression';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let log = '';
            try {
              log = fs.readFileSync('explore.log', 'utf8');
            } catch {
              log = '(explore.log was not written before the job failed)';
            }
            const tail = log.split('\n').slice(-200).join('\n');
            const body = [
              'The weekly `conformance-explore` run found a mismatch for a target the ' +
                'committed `conformance/conformance_map.json` calls `verified` (or the suite ' +
                'itself failed to run).',
              '',
              `Run: ${runUrl}`,
              '',
              'To replay a reported case, see "Profiles" in `conformance/README.md`.',
              '',
              '<details><summary>Last 200 lines of output</summary>',
              '',
              '```',
              tail,
              '```',
              '</details>',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'conformance-explore: regression against a verified target',
                body,
                labels: [label],
              });
            }
